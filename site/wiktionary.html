<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unicyclist Wiktionary</title>
<style>
  :root { --bg:#fff; --text:#202122; --muted:#54595d; --link:#0645ad; --line:#a2a9b1; --panel:#f8f9fa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: sans-serif; line-height:1.6; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  header .brand { font-family: Georgia, serif; font-size:1.4rem; font-weight:bold; color:var(--text); }
  header input { flex:1; min-width:180px; max-width:420px; padding:7px 10px; font-size:1rem; border:1px solid var(--line); border-radius:2px; }
  header .back { margin-left:auto; font-size:0.9rem; }
  main { max-width:820px; margin:0 auto; padding:20px; }
  h1 { font-family: Georgia, serif; font-weight:normal; font-size:2rem; border-bottom:1px solid var(--line); margin:0 0 4px 0; overflow-wrap:anywhere; }
  h2 { font-family: Georgia, serif; font-weight:normal; font-size:1.4rem; border-bottom:1px solid var(--line); margin:1.2rem 0 0.4rem 0; }
  .from { color:var(--muted); font-size:0.85rem; margin-bottom:12px; }
  .pos-heading { font-size:1.1rem; font-weight:bold; margin:1rem 0 0.3rem 0; }
  ol.defs { margin:0; padding-left:28px; }
  ol.defs li { overflow-wrap:anywhere; }
  .letters { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
  .letters a { border:1px solid var(--line); background:var(--panel); padding:2px 9px; border-radius:2px; }
  .letters a.on { background:var(--link); color:#fff; border-color:var(--link); }
  .word-list { columns:2 260px; padding-left:0; list-style:none; margin:0; }
  .word-list li { margin-bottom:3px; overflow-wrap:anywhere; }
  .nav { display:flex; justify-content:space-between; gap:10px; margin-top:28px; padding-top:10px; border-top:1px solid var(--line); font-size:0.9rem; }
  .muted { color:var(--muted); }
  mark { background:#fef6c7; }
  .wotd { border:1px solid #cedff2; background:#f5faff; margin:16px 0 20px 0; }
  .wotd-head { background:#cedff2; padding:4px 12px; font-weight:bold; font-size:1.05rem; }
  .wotd-body { padding:10px 14px; }
  .wotd-word { font-family: Georgia, serif; font-size:1.6rem; font-weight:bold; overflow-wrap:anywhere; }
  .wotd-pos { font-style:italic; color:var(--muted); margin-left:6px; }
  .wotd-def { margin-top:4px; overflow-wrap:anywhere; }
  .edit-link { font-family: sans-serif; font-size:0.8rem; margin-left:8px; }
  .edit-box { border:1px solid var(--line); background:var(--panel); padding:12px 14px; margin-top:20px; }
  .edit-box label { display:block; font-weight:bold; margin-top:8px; }
  .edit-box input, .edit-box textarea { width:100%; padding:6px 8px; font-size:0.95rem; border:1px solid var(--line); border-radius:2px; }
  .edit-box textarea { font-family: ui-monospace, Menlo, monospace; min-height:7rem; }
  .edit-box button { margin:10px 8px 0 0; padding:6px 14px; font-size:0.95rem; cursor:pointer; }
  .edit-error { color:#b32424; }
  .edit-ok { color:#14866d; }
  .wotd-def { white-space:pre-line; }
  .pron { color:var(--muted); margin:2px 0 6px 0; }
  h3.sub { font-size:1.05rem; margin:1rem 0 0.2rem 0; }
  .example { color:var(--muted); font-style:italic; }
  .edit-box select { padding:5px 6px; font-size:0.95rem; }
  .sec { border:1px solid var(--line); background:#fff; padding:8px 12px; margin-top:12px; }
  .sec-head { display:flex; gap:10px; align-items:center; justify-content:space-between; }
  ol.defs-edit { padding-left:26px; margin:8px 0 0 0; }
  ol.defs-edit li { margin-bottom:10px; }
  ol.defs-edit li input, ol.defs-edit li textarea { margin-top:4px; }
  .ex-row { display:flex; gap:8px; align-items:center; }
  .ex-row input { flex:1; }
  .ex-row button { margin:4px 0 0 0; }
  .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .btn-row button, .edit-box .add-pos button, .sec button { margin:0; }
  .edit-box .add-pos { margin-top:12px; }
  .edit-box textarea.dText, .edit-box #fEty { min-height:3rem; }
  .edit-box .danger { margin-left:auto; color:#b32424; border-color:#b32424; }
  /* three columns: sidebar (left edge) | content (centered) | empty mirror column.
     The two side columns are always equal and never narrower than the sidebar, so nothing overlaps. */
  .layout { display:grid; grid-template-columns: minmax(190px,1fr) minmax(0,820px) minmax(190px,1fr); align-items:start; }
  .layout main { grid-column:2; min-width:0; max-width:none; margin:0; }
  #sidebar { grid-column:1; grid-row:1; width:190px; padding:20px 0 20px 20px; position:sticky; top:0; font-size:0.92rem; }
  #sidebar .side-title { font-weight:bold; border-bottom:1px solid var(--line); margin-bottom:6px; }
  #sidebar ul { list-style:none; margin:0; padding:0; }
  #sidebar li { margin-bottom:5px; }
  .cat-box { border:1px solid var(--line); background:var(--panel); margin-top:20px; padding:6px 12px; font-size:0.9rem; }
  @media (max-width:700px) {
    .layout { display:block; }
    #sidebar { width:auto; padding:10px 20px 0 20px; position:static; }
    #sidebar ul { display:flex; flex-wrap:wrap; gap:6px 16px; }
  }
  .cat-index { line-height:1.9; }
</style>
</head>
<body>
<header>
  <a class="brand" href="#">Unicyclist Wiktionary</a>
  <input id="search" type="search" placeholder="Search words or definitions" autocomplete="off">
  <a class="back" href="index.html">Back to stats</a>
</header>
<div class="layout">
  <aside id="sidebar">
    <div class="side-title">Navigation</div>
    <ul>
      <li><a href="#">Main page</a></li>
      <li><a href="#" id="randomLink">Random word</a></li>
      <li><a href="#c=">Categories</a></li>
      <li><a href="index.html">Back to stats</a></li>
    </ul>
  </aside>
  <main id="view"><p class="muted">Loading…</p></main>
</div>

<script>
let entries = [];
let byTerm = new Map();
let stats = null;

const view = document.getElementById('view');
const searchBox = document.getElementById('search');

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function sortKey(term) {
  return term.toLowerCase().replace(/^[^a-z0-9]+/i, '');
}

function letterOf(term) {
  const c = sortKey(term).charAt(0).toUpperCase();
  return /[A-Z]/.test(c) ? c : '#';
}

function wordLink(term) {
  return `<a href="#w=${encodeURIComponent(term)}">${esc(term)}</a>`;
}

function lettersBar(active) {
  const all = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  return '<div class="letters">' + all.map(l =>
    `<a href="#l=${encodeURIComponent(l)}" class="${l === active ? 'on' : ''}">${l}</a>`
  ).join('') + '</div>';
}

function wordOfTheDayHtml() {
  const now = new Date();
  const dayNumber = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  // Each word gets a fixed score for today; the lowest score wins. Adding or editing
  // other words almost never changes the winner (unlike picking by position in the list).
  const score = (t) => {
    let h = 2166136261;
    const str = dayNumber + '|' + t.toLowerCase();
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  };
  let e = null;
  try {   // this browser remembers today's pick so it never flips during the day
    const saved = JSON.parse(localStorage.getItem('wotd') || 'null');
    if (saved && saved.day === dayNumber) e = entries.find(x => x.term === saved.term) || null;
  } catch (err) {}
  if (!e) {
    e = entries.reduce((best, x) => (best === null || score(x.term) < score(best.term)) ? x : best, null);
    try { localStorage.setItem('wotd', JSON.stringify({ day: dayNumber, term: e.term })); } catch (err) {}
  }
  const dateText = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  return `
    <div class="wotd">
      <div class="wotd-head">Word of the day for ${esc(dateText)}</div>
      <div class="wotd-body">
        <div><span class="wotd-word">${wordLink(e.term)}</span>${e.pos && e.pos !== '(no pos)' ? `<span class="wotd-pos">${esc(e.pos)}</span>` : ''}</div>
        <div class="wotd-def">${esc(e.definition)}</div>
      </div>
    </div>`;
}

function showHome() {
  const latest = stats.latest_word_term;
  view.innerHTML = `
    <h1>Unicyclist Wiktionary</h1>
    <p>${entries.length} entries. Pick a letter or search above.</p>
    ${lettersBar('')}
    ${latest && byTerm.has(latest.toLowerCase()) ? `<p>Newest word: ${wordLink(byTerm.get(latest.toLowerCase()).term)}</p>` : ''}
    ${wordOfTheDayHtml()}
    ${'#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(letter => {
      const list = entries.filter(e => letterOf(e.term) === letter);
      if (list.length === 0) return '';
      return `<h2>${letter}</h2>
        <ul class="word-list">${list.map(e => `<li>${wordLink(e.term)}</li>`).join('')}</ul>`;
    }).join('')}`;
}

document.getElementById('randomLink').onclick = (e) => {
  e.preventDefault();
  if (!entries.length) return;
  const pick = entries[Math.floor(Math.random() * entries.length)];
  location.hash = 'w=' + encodeURIComponent(pick.term);
};

// ---- categories (worked out from the data, so they update on their own) ----
function exampleCount(e) {
  return (e.senses || []).reduce((n, s) => n + s.defs.reduce((m, d) => m + (d.examples ? d.examples.length : (d.example ? 1 : 0)), 0), 0);
}
function senseCount(e) { return (e.senses || []).reduce((n, s) => n + s.defs.length, 0); }

const CATEGORIES = [
  { key: 'etym', label: 'Words with etymology', test: e => !!e.etymology },
  { key: 'no-etym', label: 'Words without etymology', test: e => !e.etymology },
  { key: 'ex', label: 'Words with example sentences', test: e => exampleCount(e) > 0 },
  { key: 'no-ex', label: 'Words without example sentences', test: e => exampleCount(e) === 0 },
  { key: 'multi-ex', label: 'Words with several example sentences', test: e => exampleCount(e) > 1 },
  { key: 'pron', label: 'Words with pronunciation', test: e => !!e.pronunciation },
  { key: 'no-pron', label: 'Words without pronunciation', test: e => !e.pronunciation },
  { key: 'multi-pos', label: 'Words with several parts of speech', test: e => (e.pos_list || []).length > 1 },
  { key: 'multi-def', label: 'Words with several definitions', test: e => senseCount(e) > 1 },
];

function pluralize(w) {
  if (/(s|x|z|ch|sh)$/i.test(w)) return w + 'es';
  if (/[^aeiou]y$/i.test(w)) return w.slice(0, -1) + 'ies';
  return w + 's';
}

function allCategories() {
  const posSet = [...new Set(entries.flatMap(e => e.pos_list || []))].filter(p => p && p !== '(no pos)').sort();
  return CATEGORIES.concat(posSet.map(p => ({ key: 'pos:' + p, label: pluralize(p), test: e => (e.pos_list || []).includes(p) })));
}

function categoriesOf(e) {
  return allCategories().filter(c => c.test(e));
}

function showCategoryIndex() {
  view.innerHTML = `
    <h1>Categories</h1>
    <ul class="cat-index">${allCategories().map(c =>
      `<li><a href="#c=${encodeURIComponent(c.key)}">${esc(c.label)}</a> <span class="muted">(${entries.filter(c.test).length})</span></li>`).join('')}</ul>`;
}

function showCategory(key) {
  const c = allCategories().find(x => x.key === key);
  if (!c) { view.innerHTML = '<h1>Category</h1><p>No category with this name.</p>'; return; }
  const list = entries.filter(c.test);
  view.innerHTML = `
    <h1>${esc(c.label)}</h1>
    <p class="muted">${list.length} entries · <a href="#c=">All categories</a></p>
    <ul class="word-list">${list.map(e => `<li>${wordLink(e.term)}</li>`).join('')}</ul>`;
}

function showLetter(letter) {
  const list = entries.filter(e => letterOf(e.term) === letter);
  view.innerHTML = `
    <h1>${esc(letter)}</h1>
    ${lettersBar(letter)}
    <p class="muted">${list.length} entries</p>
    <ul class="word-list">${list.map(e => `<li>${wordLink(e.term)}</li>`).join('')}</ul>`;
}

function entryBodyHtml(e) {
  const secs = e.senses && e.senses.length ? e.senses : [{ pos: e.pos, defs: [{ text: e.definition, examples: [] }] }];
  let html = '';
  if (e.pronunciation) html += `<div class="pron">${esc(e.pronunciation)}</div>`;
  if (e.etymology) html += `<h3 class="sub">Etymology</h3><p>${esc(e.etymology)}</p>`;
  secs.forEach(sec => {
    if (sec.pos && sec.pos !== '(no pos)') html += `<div class="pos-heading">${esc(sec.pos)}</div>`;
    html += '<ol class="defs">' + sec.defs.map(d =>
      `<li>${esc(d.text)}${(d.examples || (d.example ? [d.example] : [])).map(x => `<div class="example">${esc(x)}</div>`).join('')}</li>`).join('') + '</ol>';
  });
  return html;
}

function showEntry(term) {
  const idx = entries.findIndex(e => e.term === term);
  if (idx === -1) {
    view.innerHTML = `<h1>${esc(term)}</h1><p>No entry with this name.</p>`;
    return;
  }
  const e = entries[idx];
  const prev = entries[idx - 1];
  const next = entries[idx + 1];
  view.innerHTML = `
    <h1>${esc(e.term)}</h1>
    <div class="from">From the Unicyclist Dictionary</div>
    <h2>English <a href="#" class="edit-link" id="editLink">[edit]</a></h2>
    ${entryBodyHtml(e)}
    <div id="editPanel"></div>
    <div class="nav">
      <span>${prev ? '← ' + wordLink(prev.term) : ''}</span>
      <span>${next ? wordLink(next.term) + ' →' : ''}</span>
    </div>
    <div class="cat-box"><b>Categories:</b>
      <a href="#l=${encodeURIComponent(letterOf(e.term))}">${letterOf(e.term) === '#' ? 'Symbol and number words' : letterOf(e.term) + ' words'}</a>
      ${categoriesOf(e).map(c => ` · <a href="#c=${encodeURIComponent(c.key)}">${esc(c.label)}</a>`).join('')}
    </div>`;
  document.getElementById('editLink').onclick = (ev) => {
    ev.preventDefault();
    openEditor(e);
  };
}

function showSearch(q) {
  const lower = q.toLowerCase();
  const starts = [], contains = [], inDef = [];
  entries.forEach(e => {
    const t = e.term.toLowerCase();
    if (t.startsWith(lower)) starts.push(e);
    else if (t.includes(lower)) contains.push(e);
    else if (e.definition.toLowerCase().includes(lower)) inDef.push(e);
  });
  const shown = starts.concat(contains, inDef).slice(0, 100);
  view.innerHTML = `
    <h1>Search: ${esc(q)}</h1>
    <p class="muted">${starts.length + contains.length + inDef.length} matches${shown.length === 100 ? ' (showing first 100)' : ''}</p>
    <ol class="defs">${shown.map(e => `
      <li>${wordLink(e.term)} <span class="muted">${esc(e.definition.slice(0, 140))}${e.definition.length > 140 ? '…' : ''}</span></li>`).join('')}
    </ol>`;
}

// ===== Editing (word-processor style form; saves a new commit onto the newest dictionary file) =====
const OWNER = 'ChadDuffenshmoogle';
const REPO = 'dictionary-versions';
const BRANCH = 'main';
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const NAME_PATTERN = /^UNICYCLIST DICTIONARY v1\.2\.(\d+)\.txt$/;
const DIVIDER = /^-{20,}\s*$/;
const DIV45 = '-'.repeat(45);

// Paste the output of lock-token.html in place of "null" below (keep the semicolon).
const LOCKED_TOKEN = null;

const POS_OPTIONS = [
  ['n.', 'noun'], ['v.', 'verb'], ['adj.', 'adjective'], ['adv.', 'adverb'], ['expr.', 'expression'],
  ['inter.', 'interjection'], ['pron.', 'pronoun'], ['prep.', 'preposition'], ['conj.', 'conjunction'],
  ['acr.', 'acronym'], ['abbr.', 'abbreviation'], ['ono.', 'onomatopoeia'], ['suff.', 'suffix'],
  ['pref.', 'prefix'], ['part.', 'particle'], ['alt.', 'alternate form'], ['p.n.', 'proper noun'], ['mass n.', 'mass noun'],
];
const POS_NAMES = { n: 'Noun', v: 'Verb', adj: 'Adjective', adv: 'Adverb', expr: 'Expression', inter: 'Interjection',
  pron: 'Pronoun', prep: 'Preposition', conj: 'Conjunction', acr: 'Acronym', abbr: 'Abbreviation', ono: 'Onomatopoeia',
  suff: 'Suffix', pref: 'Prefix', part: 'Particle', alt: 'Alternate Form', pn: 'Proper Noun', massn: 'Mass Noun' };

function fromBase64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

async function unlockToken(password) {
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: fromBase64(LOCKED_TOKEN.salt), iterations: LOCKED_TOKEN.iterations, hash: 'SHA-256' },
    baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  try {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromBase64(LOCKED_TOKEN.iv) }, key, fromBase64(LOCKED_TOKEN.data));
    return new TextDecoder().decode(plain);
  } catch (e) {
    throw new Error('Wrong password.');
  }
}

function fileNameFor(number) { return `UNICYCLIST DICTIONARY v1.2.${number}.txt`; }

function ghHeaders(token, raw) {
  const h = { Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
  if (token) h.Authorization = 'Bearer ' + token;
  return h;
}

function toBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let binary = '';
  for (let i = 0; i < bytes.length; i += 8192) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(binary);
}

async function fetchLiveFile(token) {
  const treeRes = await fetch(`${API}/git/trees/${BRANCH}`, { headers: ghHeaders(token), cache: 'no-store' });
  if (!treeRes.ok) throw new Error('Could not list the repo files (' + treeRes.status + ').');
  const tree = (await treeRes.json()).tree;
  let number = 0, sha = '';
  tree.forEach(f => {
    const m = NAME_PATTERN.exec(f.path);
    if (m && parseInt(m[1], 10) > number) { number = parseInt(m[1], 10); sha = f.sha; }
  });
  if (!number) throw new Error('No dictionary file found in the repo.');
  const res = await fetch(`${API}/contents/${encodeURIComponent(fileNameFor(number))}?ref=${BRANCH}`, { headers: ghHeaders(token, true), cache: 'no-store' });
  if (!res.ok) throw new Error('Could not load v1.2.' + number + ' (' + res.status + ').');
  return { number, sha, text: await res.text() };
}

// ---- reading the file the same way the bot and generate_stats.py do ----
function fileSortKey(s) {   // same rule as sort_key_ignore_punct
  let t = s.includes(' (') ? s.split(' (')[0] : s;
  t = t.replace(/^[ '\-"]+/, '');
  if (t.toLowerCase().startsWith('the ')) t = t.slice(4) + ', the';
  return t.toLowerCase();
}
function cleanTerm(t) { return t.replace(/\(pronounced:\s*[^)]+\)/ig, '').replace(/\[[^\]]+\]/g, '').trim(); }
function parseEntryLine(line) {   // -> {term, pos, def} or null
  line = line.replace(/\)-/g, ') -');
  let m = /^(.+?) \((.+?)\) - (.+)$/.exec(line);
  if (m) return { term: cleanTerm(m[1]), pos: m[2].trim(), def: m[3].trim() };
  if (line.includes('(') && line.includes(')') && line.includes(' - ')) {
    const i = line.indexOf(' - ');
    const left = line.slice(0, i), def = line.slice(i + 3);
    const ms = [...left.matchAll(/\(([^)]+)\)/g)];
    if (ms.length && def.trim()) {
      const last = ms[ms.length - 1];
      const term = left.slice(0, last.index).trim();
      if (term) return { term: cleanTerm(term), pos: last[1].trim(), def: def.trim() };
    }
  }
  return null;
}
function isSkipLine(t) {
  return /^(etymology|derived terms|notes|ex|examples?|pronunciation|synonyms?|antonyms?)\s*:/i.test(t) || /^-\s/.test(t) || /^\d+\.\s/.test(t);
}
function stripCR(l) { return l.replace(/\r$/, ''); }

function findUnits(lines) {   // every entry = a hyphen block or a single line
  const bare = lines.map(stripCR);
  const start = bare.findIndex(l => l.trim() === '-----DICTIONARY PROPER-----');
  const units = [];
  let i = start + 1;
  while (i < bare.length) {
    const t = bare[i].trim();
    if (DIVIDER.test(t)) {
      let j = i + 1, term = null;
      while (j < bare.length && !DIVIDER.test(bare[j].trim())) {
        const tj = bare[j].trim();
        if (term === null && tj && !isSkipLine(tj)) { const p = parseEntryLine(tj); term = p ? p.term : null; }
        j++;
      }
      if (j >= bare.length) { i++; continue; }
      units.push({ start: i, end: j, block: true, term });
      i = j + 1;
    } else if (t && !isSkipLine(t)) {
      const p = parseEntryLine(t);
      if (p) {
        let end = i;
        while (end + 1 < bare.length && bare[end + 1].trim() && !DIVIDER.test(bare[end + 1].trim()) && !parseEntryLine(bare[end + 1].trim())) end++;
        units.push({ start: i, end, block: false, term: p.term });
        i = end + 1;
      } else i++;
    } else i++;
  }
  return units;
}

function findUnitFor(entry, units, lines) {
  let hits = units.filter(u => u.term === entry.term);
  if (hits.length > 1) {
    const first = entry.senses && entry.senses[0] && entry.senses[0].defs[0] ? entry.senses[0].defs[0].text : entry.definition;
    const snippet = (first || '').slice(0, 25);
    const narrowed = hits.filter(u => lines.slice(u.start, u.end + 1).map(stripCR).join('\n').includes(snippet));
    if (narrowed.length) hits = narrowed;
  }
  return hits.length === 1 ? hits[0] : null;
}

// ---- entry <-> form model ----
// model = { term, pron, ety, sections: [{ pos, defs: [{ text, examples }] }] }
function parseBlock(rawLines) {
  const lines = rawLines.map(l => l.trim());
  let term = null, pron = '', cur = null, sense = null, last = null, bad = false;
  const sections = [], ety = [];
  for (const line of lines) {
    if (!line) continue;
    let m;
    if ((m = /^etymology:\s*(.*)$/i.exec(line))) { ety.push(m[1].trim()); last = 'ety'; continue; }
    if ((m = /^pronunciation:\s*(.*)$/i.exec(line))) { pron = m[1].trim(); last = 'pron'; continue; }
    if ((m = /^(?:-\s*)?(?:examples?|ex):\s*(.*)$/i.exec(line))) {
      if (sense) { sense.examples.push(m[1].trim()); last = 'ex'; } else bad = true;
      continue;
    }
    if (/^(?:-\s*)?(derived terms|synonyms?|antonyms?|notes)\s*:/i.test(line)) { bad = true; continue; }
    if (cur && (m = /^(\d+)\.\s+(.*)$/.exec(line))) {
      sense = { text: m[2].trim(), examples: [] }; cur.defs.push(sense); last = 'def'; continue;
    }
    const p = parseEntryLine(line);
    if (p && (term === null || p.term.toLowerCase() === term.toLowerCase())) {
      if (term === null) {
        term = p.term;
        const raw = (/^(.+?) \(/.exec(line) || [])[1] || '';
        const ph = /\/[^/]+\//.exec(raw);
        if (ph) { pron = pron || ph[0]; term = cleanTerm(term.replace(ph[0], '')); }
      }
      cur = { pos: p.pos, defs: [] }; sections.push(cur);
      sense = { text: p.def.replace(/^1\.\s+/, ''), examples: [] }; cur.defs.push(sense); last = 'def';
      continue;
    }
    if (p) { bad = true; continue; }   // a different word lives in this block
    if (/^\([^)]{1,12}\)\.?$/.test(line)) { bad = true; continue; }
    const text = line.replace(/^-\s*/, '');
    if (term === null) {
      const pm = /^(.+?)\s*\(([^)]{1,20})\)\.?\s*$/.exec(line);
      if (!pm) { bad = true; continue; }
      term = cleanTerm(pm[1]); cur = { pos: pm[2].trim(), defs: [] }; sections.push(cur); sense = null; last = 'need';
    } else if (last === 'need') {
      sense = { text, examples: [] }; cur.defs.push(sense); last = 'def';
    } else if (last === 'ety' && ety.length) ety[ety.length - 1] += ' ' + text;
    else if (last === 'ex' && sense) sense.examples.push(text);
    else if (last === 'def' && sense) {
      if (/^["“'‘]/.test(text) && !sense.examples.length) { sense.examples.push(text); last = 'ex'; } else sense.text += '; ' + text;
    } else bad = true;
  }
  const secs = sections.filter(s => s.defs.some(d => d.text));
  if (!term || !secs.length) return { ok: false };
  if (!pron && secs[0].defs[0]) {
    const m = /^(\/[^/]+\/)\s*(\S.*)$/.exec(secs[0].defs[0].text);
    if (m) { pron = m[1]; secs[0].defs[0].text = m[2]; }
  }
  return { ok: !bad, model: { term, pron, ety: ety.join(' ').trim(), sections: secs } };
}

function oneLine(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }

function formatEntry(model) {   // -> { lines, block }  (same on-disk format the bot writes)
  const term = oneLine(model.term);
  const secs = model.sections.map(s => ({
    pos: oneLine(s.pos) || 'n.',
    defs: s.defs.filter(d => oneLine(d.text)).map(d => ({ text: oneLine(d.text), examples: d.examples.map(oneLine).filter(Boolean) })),
  })).filter(s => s.defs.length);
  const ety = oneLine(model.ety);
  let pron = oneLine(model.pron);
  if (pron && !(pron.startsWith('/') && pron.endsWith('/'))) pron = '/' + pron.replace(/^\/+|\/+$/g, '') + '/';
  if (secs.length === 1 && secs[0].defs.length === 1 && !secs[0].defs[0].examples.length && !ety && !pron) {
    return { lines: [`${term} (${secs[0].pos}) - ${secs[0].defs[0].text}`], block: false };
  }
  const out = [];
  secs.forEach(s => {
    const numbered = s.defs.length > 1;
    s.defs.forEach((d, i) => {
      out.push(i === 0 ? `${term} (${s.pos}) - ${numbered ? '1. ' : ''}${d.text}` : `${i + 1}. ${d.text}`);
      d.examples.forEach(x => out.push(`- Example: ${x}`));
    });
  });
  if (ety) out.push(`Etymology: ${ety}`);
  if (pron) out.push(`Pronunciation: ${pron}`);
  return { lines: out, block: true };
}

// ---- changing the file text ----
function tidyBlank(lines, s) {
  if (s > 0 && s < lines.length && lines[s - 1].trim() === '' && lines[s].trim() === '') lines.splice(s, 1);
}

function placeEntry(lines, u, inner, block, move) {
  const eol = lines[u.start].endsWith('\r') ? '\r' : '';
  const out = (block ? [DIV45, ...inner, DIV45] : inner).map(l => l + eol);
  if (!move) { lines.splice(u.start, u.end - u.start + 1, ...out); return; }
  lines.splice(u.start, u.end - u.start + 1);
  tidyBlank(lines, u.start);
  const key = fileSortKey(move);
  let at = null;
  for (const x of findUnits(lines)) {
    if (x.term && key < fileSortKey(x.term)) { at = x.start; break; }
  }
  if (at === null) { at = lines.length; while (at > 0 && lines[at - 1].trim() === '') at--; }
  if (at > 0 && lines[at - 1].trim() !== '') out.unshift(eol);
  if (at < lines.length && lines[at].trim() !== '') out.push(eol);
  lines.splice(at, 0, ...out);
}

function removeEntry(lines, u) {
  lines.splice(u.start, u.end - u.start + 1);
  tidyBlank(lines, u.start);
}

// ---- display helpers for the page after a save ----
function applyModelToEntry(entry, model) {
  const secs = model.sections.map(s => ({ pos: oneLine(s.pos), defs: s.defs.filter(d => oneLine(d.text)).map(d => ({ text: oneLine(d.text), examples: d.examples.map(oneLine).filter(Boolean) })) })).filter(s => s.defs.length);
  const senses = secs.map(s => ({ pos: POS_NAMES[s.pos.toLowerCase().replace(/[.\s]/g, '')] || s.pos, defs: s.defs }));
  const posList = [...new Set(senses.map(s => s.pos))];
  const lines = [];
  senses.forEach(s => {
    if (senses.length > 1) lines.push(`[${s.pos}]`);
    if (s.defs.length > 1) s.defs.forEach((d, i) => lines.push(`${i + 1}. ${d.text}`)); else lines.push(s.defs[0].text);
  });
  entry.term = oneLine(model.term);
  entry.senses = senses;
  entry.pos_list = posList;
  entry.pos = posList.join(' / ');
  entry.definition = lines.join('\n');
  entry.pronunciation = oneLine(model.pron);
  entry.etymology = oneLine(model.ety);
}

function resortEntries() {
  entries.sort((a, b) => sortKey(a.term).localeCompare(sortKey(b.term)));
  byTerm = new Map();
  entries.forEach(e => byTerm.set(e.term.toLowerCase(), e));
}

// ---- the editor ----
function posSelectHtml(current) {
  const known = POS_OPTIONS.some(o => o[0] === current);
  return '<select class="posSel">' +
    (known ? '' : `<option value="${esc(current)}" selected>${esc(current || '(none)')}</option>`) +
    POS_OPTIONS.map(o => `<option value="${esc(o[0])}"${o[0] === current ? ' selected' : ''}>${esc(o[1])} (${esc(o[0])})</option>`).join('') +
    '</select>';
}

async function openEditor(entry) {
  const panel = document.getElementById('editPanel');
  panel.innerHTML = '<p class="muted">Loading the live file…</p>';
  let savedToken = '';
  try { savedToken = localStorage.getItem('ghToken') || ''; } catch (e) {}

  let unit, loadedFull, innerLines;
  try {
    const live = await fetchLiveFile(savedToken);
    const lines = live.text.split('\n');
    unit = findUnitFor(entry, findUnits(lines), lines);
    if (!unit) throw new Error('This entry could not be located in the file, so it cannot be edited here.');
    const bare = lines.map(stripCR);
    loadedFull = bare.slice(unit.start, unit.end + 1).join('\n');
    innerLines = unit.block ? bare.slice(unit.start + 1, unit.end) : bare.slice(unit.start, unit.end + 1);
  } catch (err) {
    panel.innerHTML = `<p class="edit-error">${esc(err.message)}</p>`;
    return;
  }

  const parsed = parseBlock(innerLines);
  let model = parsed.ok ? parsed.model : { term: entry.term, pron: '', ety: '', sections: [{ pos: 'n.', defs: [{ text: '', examples: [] }] }] };
  let mode = parsed.ok ? 'form' : 'raw';
  let rawText = innerLines.filter(l => l.trim()).join('\n');

  panel.innerHTML = `
    <div class="edit-box">
      ${savedToken
        ? '<p class="muted">Signed in on this browser. <a href="#" id="editSignOut">Sign out</a></p>'
        : '<label for="editPassword">Password</label><input type="password" id="editPassword" autocomplete="off">'}
      <p class="muted" id="modeNote"></p>
      <div id="formView"></div>
      <div id="rawView"><label for="rawText">Raw text</label><textarea id="rawText"></textarea></div>
      <div class="btn-row">
        <button id="editSave">Save</button>
        <button id="editCancel">Cancel</button>
        <button id="modeToggle" type="button"></button>
        <button id="editDelete" type="button" class="danger">Delete whole word</button>
      </div>
      <div id="editStatus"></div>
    </div>`;
  const status = document.getElementById('editStatus');
  const formView = document.getElementById('formView');
  const rawView = document.getElementById('rawView');
  const rawArea = document.getElementById('rawText');
  const signOut = document.getElementById('editSignOut');
  if (signOut) signOut.onclick = (ev) => { ev.preventDefault(); try { localStorage.removeItem('ghToken'); } catch (e) {} openEditor(entry); };

  function setStatus(message, kind) {
    status.className = kind === 'error' ? 'edit-error' : kind === 'ok' ? 'edit-ok' : 'muted';
    status.textContent = message;
  }

  function renderForm() {
    formView.innerHTML = `
      <label>Headword</label><input id="fTerm" value="${esc(model.term)}">
      <label>Pronunciation <span class="muted">(optional)</span></label><input id="fPron" value="${esc(model.pron)}" placeholder="/…/">
      <label>Etymology <span class="muted">(optional)</span></label><textarea id="fEty" rows="2">${esc(model.ety)}</textarea>
      ${model.sections.map((s, si) => `
        <div class="sec" data-s="${si}">
          <div class="sec-head">${posSelectHtml(s.pos)}<button type="button" class="delSec">Delete part of speech</button></div>
          <ol class="defs-edit">
            ${s.defs.map((d, di) => `
              <li data-d="${di}">
                <textarea class="dText" rows="2" placeholder="Definition">${esc(d.text)}</textarea>
                ${d.examples.map(x => `<div class="ex-row"><input class="dEx" value="${esc(x)}" placeholder="Example sentence"><button type="button" class="delEx">Delete example</button></div>`).join('')}
                <button type="button" class="addEx">+ add example</button>
                ${s.defs.length > 1 ? '<button type="button" class="delDef">Delete definition</button>' : ''}
              </li>`).join('')}
          </ol>
          <button type="button" class="addDef">+ add definition</button>
        </div>`).join('')}
      <div class="add-pos">
        <button type="button" id="addPos">+ add part of speech</button>
        <span id="posPicker" style="display:none">${posSelectHtml('n.').replace('class="posSel"', 'id="newPos"')} <button type="button" id="posOk">Add</button></span>
      </div>`;
  }

  function collect() {
    if (!document.getElementById('fTerm')) return;
    model.term = document.getElementById('fTerm').value;
    model.pron = document.getElementById('fPron').value;
    model.ety = document.getElementById('fEty').value;
    formView.querySelectorAll('.sec').forEach(secEl => {
      const s = model.sections[+secEl.dataset.s];
      s.pos = secEl.querySelector('.posSel').value;
      secEl.querySelectorAll('li').forEach(li => {
        const d = s.defs[+li.dataset.d];
        d.text = li.querySelector('.dText').value;
        d.examples = Array.from(li.querySelectorAll('.dEx')).map(i => i.value);
      });
    });
  }

  formView.addEventListener('click', (ev) => {
    const t = ev.target;
    const secEl = t.closest('.sec');
    if (t.id === 'addPos') { document.getElementById('posPicker').style.display = ''; t.style.display = 'none'; return; }
    if (t.id === 'posOk') {
      collect();
      model.sections.push({ pos: document.getElementById('newPos').value, defs: [{ text: '', examples: [] }] });
      renderForm(); return;
    }
    if (!secEl) return;
    collect();
    const s = model.sections[+secEl.dataset.s];
    if (t.classList.contains('addDef')) s.defs.push({ text: '', examples: [] });
    else if (t.classList.contains('delDef')) s.defs.splice(+t.closest('li').dataset.d, 1);
    else if (t.classList.contains('addEx')) s.defs[+t.closest('li').dataset.d].examples.push('');
    else if (t.classList.contains('delEx')) {
      const row = t.closest('.ex-row');
      s.defs[+t.closest('li').dataset.d].examples.splice(Array.from(row.parentNode.querySelectorAll('.ex-row')).indexOf(row), 1);
    }
    else if (t.classList.contains('delSec')) model.sections.splice(+secEl.dataset.s, 1);
    else return;
    renderForm();
  });

  function showMode() {
    formView.style.display = mode === 'form' ? '' : 'none';
    rawView.style.display = mode === 'raw' ? '' : 'none';
    document.getElementById('modeToggle').textContent = mode === 'form' ? 'Raw text' : 'Back to form';
    document.getElementById('modeNote').textContent = mode === 'raw' && !parsed.ok && innerLines.length
      ? 'The form could not read this older entry, so it opens as raw text.' : '';
  }

  document.getElementById('modeToggle').onclick = () => {
    if (mode === 'form') {
      collect();
      const f = formatEntry(model);
      rawArea.value = f.lines.length && model.sections.some(s => s.defs.some(d => d.text.trim())) ? f.lines.join('\n') : rawText;
      mode = 'raw';
    } else {
      const p = parseBlock(rawArea.value.split('\n'));
      if (!p.ok) return setStatus('The form cannot read this text, so it stays as raw text.', 'error');
      model = p.model; renderForm(); mode = 'form';
    }
    setStatus('');
    showMode();
  };

  renderForm();
  rawArea.value = rawText;
  rawArea.rows = Math.max(4, rawText.split('\n').length + 1);
  showMode();

  document.getElementById('editCancel').onclick = () => { panel.innerHTML = ''; };

  async function ensureToken() {
    if (savedToken) return savedToken;
    if (!LOCKED_TOKEN) throw new Error('Editing is not set up yet.');
    const password = document.getElementById('editPassword').value;
    if (!password) throw new Error('Enter the password first.');
    setStatus('Unlocking…');
    const token = await unlockToken(password);
    try { localStorage.setItem('ghToken', token); } catch (e) {}
    savedToken = token;
    return token;
  }

  // Re-reads the live file, checks the entry did not change, applies `change`, saves.
  async function pushChange(change, message) {
    const token = await ensureToken();
    setStatus('Saving…');
    const live = await fetchLiveFile(token);
    const lines = live.text.split('\n');
    const u = findUnitFor(entry, findUnits(lines), lines);
    if (!u || lines.slice(u.start, u.end + 1).map(stripCR).join('\n') !== loadedFull) {
      throw new Error('This entry changed since it was loaded. Close the editor and try again.');
    }
    change(lines, u);
    const res = await fetch(`${API}/contents/${encodeURIComponent(fileNameFor(live.number))}`, {
      method: 'PUT',
      headers: { ...ghHeaders(token), 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message(live.number), content: toBase64(lines.join('\n')), sha: live.sha, branch: BRANCH }),
    });
    if (res.status === 409 || res.status === 422) throw new Error('The file changed while saving. Close the editor and try again.');
    if (res.status === 401 || res.status === 403 || res.status === 404) {
      try { localStorage.removeItem('ghToken'); } catch (e) {}
      throw new Error('GitHub rejected the token. It may have expired. Close the editor and reopen it to sign in again.');
    }
    if (!res.ok) throw new Error('Save failed (' + res.status + ').');
    return live.number;
  }

  document.getElementById('editSave').onclick = async () => {
    try {
      let inner, block, newTerm, newModel = null;
      if (mode === 'form') {
        collect();
        newTerm = oneLine(model.term);
        if (!newTerm) throw new Error('The headword cannot be empty.');
        if (!model.sections.some(s => s.defs.some(d => oneLine(d.text)))) throw new Error('Add at least one definition.');
        if (model.sections.some(s => !oneLine(s.pos))) throw new Error('Every part of speech needs a label.');
        const f = formatEntry(model);
        inner = f.lines; block = f.block; newModel = model;
      } else {
        inner = rawArea.value.split('\n').map(l => l.replace(/\r/g, '').trimEnd()).filter(l => l.trim());
        if (!inner.length) throw new Error('The entry cannot be empty.');
        const mainLine = inner.find(l => !isSkipLine(l.trim()) && parseEntryLine(l.trim()));
        if (!mainLine) throw new Error('Keep one line shaped like: word (pos) - definition');
        newTerm = parseEntryLine(mainLine.trim()).term;
        block = unit.block || inner.length > 1;
        const p = parseBlock(inner);
        if (p.ok) newModel = p.model;
      }
      const newFull = block ? [DIV45, ...inner, DIV45].join('\n') : inner.join('\n');
      if (newFull === loadedFull) throw new Error('Nothing was changed.');
      const renamed = newTerm !== unit.term;
      if (renamed && newTerm.toLowerCase() !== entry.term.toLowerCase() && byTerm.has(newTerm.toLowerCase())) {
        throw new Error(`There is already an entry called "${newTerm}".`);
      }
      const oldTerm = entry.term;
      const number = await pushChange(
        (lines, u) => placeEntry(lines, u, inner, block, renamed ? newTerm : null),
        n => renamed ? `Edit dictionary v1.2.${n}: rename '${oldTerm}' to '${newTerm}'` : `Edit dictionary v1.2.${n}: update '${oldTerm}'`
      );
      if (newModel) applyModelToEntry(entry, newModel);
      else { entry.term = newTerm; }
      resortEntries();
      location.hash = 'w=' + encodeURIComponent(entry.term);
      if (location.hash === '#w=' + encodeURIComponent(entry.term)) showEntry(entry.term);
    } catch (err) {
      setStatus(err.message, 'error');
    }
  };

  document.getElementById('editDelete').onclick = async () => {
    if (!confirm(`Are you sure you want to delete "${entry.term}" from the dictionary?`)) return;
    try {
      const oldTerm = entry.term;
      await pushChange((lines, u) => removeEntry(lines, u), n => `Edit dictionary v1.2.${n}: remove '${oldTerm}'`);
      entries = entries.filter(e => e !== entry);
      resortEntries();
      location.hash = '';
      route();
    } catch (err) {
      setStatus(err.message, 'error');
    }
  };
}

function route() {
  const hash = location.hash.replace(/^#/, '');
  if (hash.startsWith('w=')) return showEntry(decodeURIComponent(hash.slice(2)));
  if (hash.startsWith('c=')) { const k = decodeURIComponent(hash.slice(2)); return k ? showCategory(k) : showCategoryIndex(); }
  if (hash.startsWith('l=')) return showLetter(decodeURIComponent(hash.slice(2)));
  if (hash.startsWith('q=')) return showSearch(decodeURIComponent(hash.slice(2)));
  showHome();
}

searchBox.addEventListener('input', () => {
  const q = searchBox.value.trim();
  location.hash = q ? 'q=' + encodeURIComponent(q) : '';
});

window.addEventListener('hashchange', route);

(async function start() {
  try {
    const res = await fetch('stats.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('stats.json not found (' + res.status + ')');
    stats = await res.json();
    entries = (stats.definitions_by_length_asc || []).slice()
      .sort((a, b) => sortKey(a.term).localeCompare(sortKey(b.term)));
    entries.forEach(e => byTerm.set(e.term.toLowerCase(), e));
    route();
  } catch (err) {
    view.innerHTML = `<p class="muted">Could not load the dictionary: ${esc(err.message)}</p>`;
  }
})();
</script>
</body>
</html>
