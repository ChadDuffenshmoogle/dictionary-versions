<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dictionary Lint</title>
<style>
  body {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 16px;
    font-family: monospace;
    color: #111;
    background: #fff;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p { color: #555; margin-top: 0; }
  textarea {
    width: 100%;
    height: 320px;
    font-family: monospace;
    font-size: 0.9rem;
    box-sizing: border-box;
    padding: 8px;
  }
  button {
    margin-top: 10px;
    padding: 8px 16px;
    font-family: monospace;
    font-size: 0.95rem;
    cursor: pointer;
  }
  pre#output {
    white-space: pre-wrap;
    word-break: break-word;
    border-top: 1px solid #ccc;
    margin-top: 20px;
    padding-top: 14px;
    font-size: 0.85rem;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h1>Dictionary Lint</h1>
<p>Paste the dictionary .txt content below, then click Check. Nothing leaves this page -- it's all checked in your browser.</p>

<textarea id="input" placeholder="Paste dictionary text here..."></textarea>
<br>
<button id="checkBtn">Check</button>
<pre id="output"></pre>

<script>
function cleanTerm(t) {
  return t.replace(/\(pronounced:\s*[^)]+\)/i, '').replace(/\[[^\]]+\]/g, '').trim();
}

function sortKeyIgnorePunct(s) {
  let term = s.includes(' (') ? s.split(' (')[0] : s;
  term = term.replace(/^[\s'"\-]+/, '');
  if (/^the\s/i.test(term)) term = term.slice(4);
  return term.toLowerCase();
}

function partition(str, sep) {
  const i = str.indexOf(sep);
  if (i === -1) return [str, '', ''];
  return [str.slice(0, i), sep, str.slice(i + sep.length)];
}

const METADATA_LABELS = ['etymology', 'derived terms', 'synonym', 'synonyms', 'ex', 'example', 'notes', 'antonym', 'antonyms'];

function isMetadataLine(line) {
  const stripped = line.trim();
  const label = stripped.replace(/:$/, '').toLowerCase();
  if (METADATA_LABELS.includes(label)) return true;
  if (/^(etymology|derived terms|synonym|synonyms|ex|example|notes|antonym|antonyms):/i.test(stripped)) return true;
  if (/^\([^)]{1,12}\)\.?$/.test(stripped)) return true;
  if (/^[a-zA-Z\-']+\)$/.test(stripped)) return true;
  return false;
}

function parseEntryLine(rawLine) {
  const line = rawLine.replace(/\)-/g, ') -');

  // 1. Strict: "term (pos) - definition"
  let m = line.match(/^(.+?) \((.+?)\) - (.+)$/);
  if (m) {
    return { term: cleanTerm(m[1]), pos: m[2].trim(), definition: m[3].trim(), strict: true };
  }

  // 2. Loose: last "(...)" before " - " is the pos tag
  if (line.includes('(') && line.includes(')') && line.includes(' - ')) {
    const [left, , definition] = partition(line, ' - ');
    const parenMatches = [...left.matchAll(/\(([^)]+)\)/g)];
    if (parenMatches.length && definition.trim()) {
      const last = parenMatches[parenMatches.length - 1];
      const termPart = left.slice(0, last.index).trim();
      if (termPart) {
        return { term: cleanTerm(termPart), pos: last[1].trim(), definition: definition.trim(), strict: false };
      }
    }
  }

  // 3. No parentheses: "term - definition" (no pos tag available)
  for (const sep of [' - ', ' — ', ' – ']) {
    if (line.includes(sep)) {
      const [term, , definition] = partition(line, sep);
      if (term.trim() && definition.trim()) {
        return { term: cleanTerm(term), pos: '', definition: definition.trim(), strict: false };
      }
    }
  }

  return null;
}

function collectContinuation(blockLines, startIdx) {
  const chunks = [];
  let j = startIdx;
  while (j < blockLines.length) {
    const nxt = blockLines[j];
    if (!nxt) { j++; continue; }
    const nxtUnbulleted = nxt.replace(/^-\s*/, '');
    if (/^(etymology|ex|example|synonym|synonyms|antonym|antonyms|derived terms|notes)\b/i.test(nxtUnbulleted)) break;
    const lower = nxt.toLowerCase();
    if (/^\([^)]{1,12}\)\.?$/.test(nxt) ||
        ['noun', 'verb', 'adjective', 'adverb', 'interjection', 'pronoun', 'preposition'].includes(lower)) {
      j++;
      continue;
    }
    chunks.push(nxtUnbulleted);
    j++;
  }
  return chunks;
}

function parseProper(text) {
  const marker = '-----DICTIONARY PROPER-----';
  const idx = text.indexOf(marker);
  const body = idx === -1 ? text : text.slice(idx + marker.length);
  const lines = body.split('\n');
  const entries = [];
  const emptyBlocks = [];
  let inBlock = false;
  let blockLines = [];
  let delimCount = 0;

  function processBlock(bl) {
    let mainIdx = -1;
    for (let i = 0; i < bl.length; i++) {
      const line = bl[i].trim();
      if (!line || isMetadataLine(line)) continue;
      mainIdx = i;
      break;
    }
    if (mainIdx === -1) {
      emptyBlocks.push(bl.filter(l => l.trim()).join(' / ') || '(blank block)');
      return;
    }

    const mainLine = bl[mainIdx].trim();
    let parsed = parseEntryLine(mainLine);
    let usedFallback = false;

    if (!parsed) {
      // No dash/colon separator on the main line at all -- the
      // definition is probably down in the continuation lines instead
      // (e.g. "anoline (adj.) /pronunciation/" on its own, definition
      // below). Strip a trailing pronunciation guide, pull the last
      // "(pos)" off the end, and treat everything after as the term.
      const mainLineNoPron = mainLine.replace(/\s*\/[^/]+\/\s*$/, '');
      const posMatch = mainLineNoPron.match(/\(([^)]{1,20})\)\.?\s*$/);
      const pos = posMatch ? posMatch[1].trim() : '';
      const termPart = mainLineNoPron.replace(/\s*\([^)]{1,20}\)\.?\s*$/, '').trim();
      if (termPart) {
        const chunks = collectContinuation(bl, mainIdx + 1);
        if (chunks.length) {
          parsed = { term: cleanTerm(termPart), pos, definition: chunks.join('; '), strict: false };
          usedFallback = true;
        }
      }
    }

    // Even when the main line parsed fine by itself, trailing bulleted or
    // bare continuation lines (extra examples, wrapped definition text)
    // still belong to this entry rather than being dropped.
    if (parsed && !usedFallback) {
      const extra = collectContinuation(bl, mainIdx + 1);
      if (extra.length) {
        parsed = { term: parsed.term, pos: parsed.pos, definition: parsed.definition + '; ' + extra.join('; '), strict: parsed.strict };
      }
    }

    entries.push({ raw: mainLine, parsed });
  }

  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (/^-{20,}$/.test(line)) {
      delimCount++;
      if (inBlock) {
        processBlock(blockLines);
        blockLines = [];
        inBlock = false;
      } else {
        inBlock = true;
        blockLines = [];
      }
      continue;
    }
    if (inBlock) {
      blockLines.push(line);
    } else if (line && !isMetadataLine(line)) {
      // A standalone entry with no surrounding "-----" block at all.
      entries.push({ raw: line, parsed: parseEntryLine(line) });
    }
  }
  if (inBlock && blockLines.length) processBlock(blockLines);

  return { entries, emptyBlocks, found: body.trim().length > 0, oddDelimiters: delimCount % 2 !== 0 };
}

function runCheck() {
  const text = document.getElementById('input').value;
  const out = [];

  const proper = parseProper(text);

  if (!proper.found) out.push('\u26A0 Nothing to check -- paste the dictionary text into the box above.');
  if (proper.found && proper.oddDelimiters) {
    out.push('\u26A0 Odd number of "-----" delimiter lines -- a block is unclosed, so everything after it may be read wrong.');
  }
  if (proper.found && proper.emptyBlocks.length) {
    out.push(`\n\u274C ${proper.emptyBlocks.length} block(s) between "-----" lines had no readable entry at all:`);
    proper.emptyBlocks.forEach(b => out.push(`   - "${b}"`));
  }

  const properEntries = proper.entries.filter(e => e.parsed);
  const unparseable = proper.entries.filter(e => !e.parsed);

  const properNorm = new Map();
  properEntries.forEach(e => {
    const norm = e.parsed.term.toLowerCase().trim();
    if (!properNorm.has(norm)) properNorm.set(norm, []);
    properNorm.get(norm).push(e);
  });

  if (unparseable.length) {
    out.push(`\n\u274C ${unparseable.length} entr${unparseable.length === 1 ? 'y' : 'ies'} could not be parsed at all:`);
    unparseable.forEach(e => out.push(`   - "${e.raw}"`));
  }

  const loose = properEntries.filter(e => !e.parsed.strict);
  if (loose.length) {
    out.push(`\n\u26A0 ${loose.length} entr${loose.length === 1 ? 'y' : 'ies'} didn't match the standard "term (pos) - definition" format:`);
    loose.forEach(e => out.push(`   - "${e.raw}"`));
  }

  const missingPos = properEntries.filter(e => !e.parsed.pos);
  if (missingPos.length) {
    out.push(`\n\u26A0 ${missingPos.length} entr${missingPos.length === 1 ? 'y has' : 'ies have'} no part-of-speech tag:`);
    missingPos.forEach(e => out.push(`   - "${e.parsed.term}"`));
  }

  const properDupes = [...properNorm.entries()].filter(([, v]) => v.length > 1);
  if (properDupes.length) {
    out.push(`\n\u26A0 ${properDupes.length} term(s) appear more than once:`);
    properDupes.forEach(([, list]) => out.push(`   - "${list[0].parsed.term}" (${list.length}x)`));
  }

  // --- Alphabetization check ---
  function findOutOfOrder(termList) {
    const issues = [];
    for (let i = 1; i < termList.length; i++) {
      if (sortKeyIgnorePunct(termList[i]) < sortKeyIgnorePunct(termList[i - 1])) {
        issues.push({ prev: termList[i - 1], cur: termList[i] });
      }
    }
    return issues;
  }

  if (proper.found) {
    const misorder = findOutOfOrder(properEntries.map(e => e.parsed.term));
    if (misorder.length) {
      out.push(`\n\u26A0 ${misorder.length} place(s) are out of alphabetical order:`);
      misorder.forEach(({ prev, cur }) => out.push(`   - "${cur}" comes right after "${prev}", but should come before it`));
    }
  }

  if (out.length === 0) out.push('\u2705 No issues found.');

  document.getElementById('output').textContent = out.join('\n');
}

document.getElementById('checkBtn').addEventListener('click', runCheck);
</script>

</body>
</html>
